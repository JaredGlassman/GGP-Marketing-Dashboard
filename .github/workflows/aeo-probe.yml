name: Weekly AI share-of-voice probe
on:
  schedule: [{cron: "17 13 * * 1"}]   # Mondays 13:17 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no API key
        id: key
        run: echo "has=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.has == 'true'
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: steps.key.outputs.has == 'true'
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: |
          pip install anthropic
          python3 seo/scripts/aeo_probe.py | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "aeo-probe-bot"; git config user.email "actions@users.noreply.github.com"
          git add seo/data/aeo_results.jsonl && git commit -m "AEO probe results $(date -u +%F)" && git push || true
